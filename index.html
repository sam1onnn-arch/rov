<!doctype html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090a">
<title>ROVE Georgia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2309090a'/%3E%3Cpath d='M17 47V17h18q15 0 15 12 0 9-10 11l11 7H36L26 38v9zm9-21v6h9q5 0 5-3t-5-3z' fill='%23c8b08a'/%3E%3C/svg%3E">
<link rel="preload" href="assets/g63.webp" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+Georgian:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090a;--bg2:#0f0f11;--surf:#131315;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);
  --text:#ebe7df;--muted:#8f8c86;--accent:#c8b08a;--accent-ink:#14110b;
  --font:'Inter','Noto Sans Georgian','Heebo',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
html[lang=he] body{font-family:'Heebo','Inter',sans-serif}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.wrap{width:min(1280px,100% - 48px);margin-inline:auto}
bdi{unicode-bidi:isolate}
[hidden]{display:none!important}

/* preloader */
.pre{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .9s var(--ease),visibility .9s;animation:preFallback .01s 5s forwards}
.pre.done{opacity:0;visibility:hidden;pointer-events:none}
@keyframes preFallback{to{opacity:0;visibility:hidden;pointer-events:none}}
.pre-in{display:grid;justify-items:center;gap:26px;direction:ltr}
.pre-word{font-size:clamp(34px,6vw,64px);font-weight:200;letter-spacing:.5em;margin-inline-end:-.5em;display:flex}
.pre-word span{opacity:0;transform:translateY(14px);animation:letter .9s var(--ease) forwards}
.pre-word span:nth-child(1){animation-delay:.1s}.pre-word span:nth-child(2){animation-delay:.22s}.pre-word span:nth-child(3){animation-delay:.34s}.pre-word span:nth-child(4){animation-delay:.46s}
.pre-sub{font-size:11px;letter-spacing:.7em;margin-inline-end:-.7em;color:var(--muted);opacity:0;animation:fade 1s .8s forwards}
.pre-line{width:min(220px,50vw);height:1px;background:var(--line);overflow:hidden;opacity:0;animation:fade .6s .6s forwards}
.pre-line i{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;animation:bar 1.7s .7s var(--ease) forwards}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes bar{to{transform:scaleX(1)}}

/* header */
.header{position:fixed;inset-inline:0;top:0;z-index:60;transition:background .5s,border-color .5s;border-bottom:1px solid transparent}
.header.solid{background:rgba(9,9,10,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:var(--line)}
.header .wrap{display:flex;align-items:center;gap:36px;height:76px}
.brand{font-weight:300;font-size:22px;letter-spacing:.42em;display:flex;align-items:baseline;gap:12px;direction:ltr;white-space:nowrap}
.brand small{font-size:9px;letter-spacing:.5em;color:var(--muted);font-weight:400}
.nav{display:flex;gap:34px;margin-inline-start:auto}
.nav a{font-size:13px;letter-spacing:.06em;color:#cfcac1;position:relative;padding:6px 0;transition:color .3s}
.nav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
[dir=rtl] .nav a::after{transform-origin:right}
.nav a:hover{color:#fff}.nav a:hover::after{transform:scaleX(1)}
.hdr-end{display:flex;align-items:center;gap:28px}
.lang{display:flex;gap:2px;direction:ltr;font-size:12px;letter-spacing:.12em}
.lang button{padding:6px 8px;color:var(--muted);transition:color .3s;position:relative}
.lang button:hover{color:#fff}
.lang button[aria-pressed=true]{color:var(--text)}
.lang button[aria-pressed=true]::after{content:"";position:absolute;inset-inline:8px;bottom:2px;height:1px;background:var(--accent)}
.menu-btn{display:none;width:40px;height:40px;place-items:center}
.menu-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.2}
.mnav{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 34px;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line2);transition:.4s var(--ease);border-radius:2px}
html[lang=ka] .btn,html[lang=he] .btn{letter-spacing:.04em;text-transform:none;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:var(--text);color:#0b0b0c;border-color:var(--text)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:11px 22px;font-size:12px}
.btn.full{width:100%}
.arr{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.2;flex:none}
[dir=rtl] .arr{transform:scaleX(-1)}

/* hero */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;display:flex;align-items:flex-end}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity 1.6s var(--ease),transform 9s linear}
.hero-photo.on{opacity:1;transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(9,9,10,.92) 0%,rgba(9,9,10,.25) 45%,rgba(9,9,10,.45) 100%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:120px;display:grid;gap:34px}
.hero h1{font-size:clamp(42px,6vw,88px);line-height:1.04;font-weight:200;letter-spacing:-.025em;max-width:7.2em}
html[lang=ka] .hero h1,html[lang=he] .hero h1{letter-spacing:0;line-height:1.1}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:44ch;color:#cdc8bf;font-size:17px}
.hero-cta{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.hero-foot{position:absolute;z-index:3;inset-inline:0;bottom:36px}
.hero-foot .wrap{padding:0;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.counter{display:flex;gap:16px;align-items:center;direction:ltr}
.counter b{color:var(--text);font-weight:400}
.dots{display:flex;gap:8px}
.dots button{width:36px;height:17px;background:linear-gradient(var(--line2),var(--line2)) center/100% 1px no-repeat}
.dots button.on{background:linear-gradient(var(--accent),var(--accent)) center/100% 1px no-repeat}

.strip{border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.strip div{padding:30px 24px;font-size:13px;letter-spacing:.08em;color:#cdc8bf;border-inline-start:1px solid var(--line)}
.strip div:first-child{border-inline-start:0;padding-inline-start:0}

section{padding:130px 0}
h2{font-size:clamp(30px,4.2vw,56px);font-weight:200;letter-spacing:-.02em;line-height:1.1}
html[lang=ka] h2,html[lang=he] h2{letter-spacing:0}
.lead{color:var(--muted);margin-top:18px;max-width:50ch}

/* fleet */
.tabs{scrollbar-width:none;display:flex;gap:36px;margin:56px 0 40px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:0 0 16px;font-size:13px;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .3s}
.tab:hover{color:#fff}
.tab[aria-pressed=true]{color:var(--text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:56px 32px}
.card{display:block;position:relative}
.card[hidden]{display:none}
.shot{position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--surf);display:block}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.card:hover .shot img{transform:scale(1.035)}
.fav{position:absolute;top:16px;inset-inline-end:16px;width:40px;height:40px;display:grid;place-items:center;z-index:2;background:rgba(9,9,10,.45);backdrop-filter:blur(8px);border-radius:50%}
.fav svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.3}
.fav[aria-pressed=true] svg{fill:var(--accent);stroke:var(--accent)}
.cmeta{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-top:22px}
.make{font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.model{font-size:30px;font-weight:300;letter-spacing:-.01em;line-height:1.2;margin-top:4px}
.cprice{text-align:end;white-space:nowrap}
.cprice b{font-weight:300;font-size:26px}
.cprice small{font-size:13px;color:var(--muted)}
.cspecs{display:flex;gap:14px 22px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:#b9b5ac;flex-wrap:wrap}

/* services */
.services{border-block:1px solid var(--line);background:var(--bg2)}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:72px}
.svc{padding:0 40px 8px;border-inline-start:1px solid var(--line)}
.svc:first-child{padding-inline-start:0;border-inline-start:0}
.svc .n{font-size:13px;color:var(--accent);letter-spacing:.2em;display:block;margin-bottom:56px}
.svc h3{font-size:22px;font-weight:300;line-height:1.3;margin-bottom:14px}
.svc p{color:var(--muted);font-size:15px}

/* faq */
.faq-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:80px}
details{border-bottom:1px solid var(--line)}
details:first-child{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0;font-size:18px;font-weight:300}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:12px;height:12px;flex:none;background:linear-gradient(var(--accent),var(--accent)) center/100% 1px no-repeat,linear-gradient(var(--accent),var(--accent)) center/1px 100% no-repeat;transition:transform .4s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--muted);padding:0 40px 28px 0;max-width:60ch}
[dir=rtl] details p{padding:0 0 28px 40px}

/* footer */
.foot{border-top:1px solid var(--line);padding:90px 0 36px}
.foot .top{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:60px}
.foot .tagline{font-size:26px;font-weight:200;margin-top:28px;max-width:16ch;line-height:1.25}
.foot h4{font-size:11px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
html[lang=ka] .foot h4,html[lang=he] .foot h4{letter-spacing:.04em;text-transform:none;font-size:13px}
.foot ul{list-style:none;padding:0;display:grid;gap:14px}
.foot li a,.foot li button{color:#cdc8bf;transition:color .3s;text-align:start}
.foot li a:hover,.foot li button:hover{color:var(--accent)}
.foot .bottom{margin-top:90px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);letter-spacing:.06em}

/* inner pages */
.page{padding-top:76px}
.stickbar{position:sticky;top:76px;z-index:40;background:rgba(9,9,10,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.stickbar .wrap{display:flex;justify-content:space-between;align-items:center;height:64px;gap:20px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.stickbar .r{display:flex;align-items:center;gap:24px}
.stickbar .r b{font-size:20px;font-weight:300;color:var(--text)}
.back{display:inline-flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);letter-spacing:.06em;transition:color .3s;margin:44px 0 30px}
.back:hover{color:var(--accent)}
.back .arr{transform:scaleX(-1)}
[dir=rtl] .back .arr{transform:none}
.cwrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:64px;align-items:start;padding-bottom:120px}
.ctitle{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
.ctitle h1{font-size:clamp(40px,5vw,68px);font-weight:200;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.save{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);letter-spacing:.06em;transition:color .3s}
.save svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.3}
.save[aria-pressed=true]{color:var(--accent)}.save[aria-pressed=true] svg{fill:var(--accent)}
.bigshot{aspect-ratio:16/10;overflow:hidden;background:var(--surf)}
.bigshot img{width:100%;height:100%;object-fit:cover}
.sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:72px 0 26px}
html[lang=ka] .sub,html[lang=he] .sub{letter-spacing:.04em;text-transform:none;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.tile{padding:22px 0;border-bottom:1px solid var(--line);padding-inline-end:20px}
.tile dt{font-size:12px;color:var(--muted);letter-spacing:.08em}
.tile dd{margin:6px 0 0;font-size:22px;font-weight:300}
.cdesc{font-size:18px;color:#cdc8bf;max-width:62ch;line-height:1.7}
.incl{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;list-style:none;padding:0}
.incl li{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;font-size:15px;color:#cdc8bf}
.incl svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.4;flex:none}
.panel{position:sticky;top:164px;border:1px solid var(--line2);padding:34px;background:var(--bg2)}
.panel h2{font-size:22px;font-weight:300;margin-bottom:26px;letter-spacing:0}
.prow{padding:20px 0;border-top:1px solid var(--line)}
.plabel{font-size:12px;color:var(--muted);letter-spacing:.1em}
.pval{font-size:22px;font-weight:300;margin-top:4px}
.pnote{font-size:13px;color:var(--muted);margin-top:6px}
.pprice{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.pprice b{font-size:40px;font-weight:200;line-height:1}
.panel .btn{margin-top:14px}
.others{border-top:1px solid var(--line);padding:100px 0 120px}
.others .grid{margin-top:48px;grid-template-columns:repeat(2,1fr)}

/* booking */
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:80px;align-items:start;padding-bottom:140px}
.bwrap h1{font-size:clamp(36px,4.6vw,60px);font-weight:200;letter-spacing:-.02em;line-height:1.1;margin-bottom:12px}
.bcar{color:var(--muted);margin-bottom:48px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:34px 28px}
.fields .wide{grid-column:1/-1}
label{display:grid;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.1em}
input,select{background:transparent;border:0;border-bottom:1px solid var(--line2);padding:10px 0 12px;width:100%;color:var(--text);font-size:17px;font-weight:300;border-radius:0;color-scheme:dark;transition:border-color .3s}
select option{background:#131315}
input:focus,select:focus{outline:0;border-color:var(--accent)}
.err{color:#e59a8f;font-size:13px;min-height:1.4em}
.quote{border:1px solid var(--line2);padding:34px;background:var(--bg2);position:sticky;top:110px}
.quote .qcar{display:flex;gap:16px;align-items:center;padding-bottom:22px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.quote .qcar img{width:96px;aspect-ratio:3/2;object-fit:cover}
.quote .qcar b{display:block;font-weight:300;font-size:19px}
.quote .qcar small{color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.row span:first-child{color:var(--muted)}
.row.total{border-bottom:0;padding-top:22px;font-size:26px;font-weight:200}
.row.total span:first-child{color:var(--text);font-size:13px;letter-spacing:.1em;align-self:center;font-weight:300}
.note{font-size:12px;color:var(--muted);margin:6px 0 20px}
.done{padding:60px 0 140px;max-width:560px}
.done .tick{width:60px;height:60px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;margin-bottom:34px}
.done .tick svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.3}
.done h1{font-size:clamp(34px,4vw,52px);font-weight:200;margin-bottom:16px}
.done p{color:#cdc8bf;margin-bottom:14px}
.done .btn{margin-top:26px}
.toast{position:fixed;bottom:26px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--text);color:#0b0b0c;padding:14px 26px;font-size:13px;letter-spacing:.04em;opacity:0;transform:translateY(12px);pointer-events:none;transition:.4s var(--ease);z-index:150}
.toast.show{opacity:1;transform:none}

.rv{opacity:0;transform:translateY(26px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}

@media (max-width:1000px){
  .nav,.hdr-end .lang{display:none}
  .menu-btn{display:grid}
  .header .wrap{gap:12px}
  .hdr-end{margin-inline-start:auto}
  .mnav{display:grid;padding:8px 24px 28px;background:rgba(9,9,10,.97);border-bottom:1px solid var(--line);gap:0}
  .mnav a{padding:18px 0;border-bottom:1px solid var(--line);font-size:18px;font-weight:200}
  .mnav .lang{display:flex;padding-top:22px;gap:6px}
  .mnav .lang button{font-size:14px}
  .grid,.others .grid{grid-template-columns:1fr}
  .strip .wrap{grid-template-columns:1fr 1fr}
  .strip div{border-inline-start:0;border-top:1px solid var(--line);padding:22px 0}
  .strip div:nth-child(-n+2){border-top:0}
  .svc-grid,.foot .top,.faq-grid{grid-template-columns:1fr}
  .faq-grid{gap:40px}
  .svc{border-inline-start:0;padding:0 0 44px}
  .svc .n{margin-bottom:22px}
  .cwrap,.bwrap{grid-template-columns:1fr;gap:44px}
  .panel,.quote{position:static}
  section{padding:84px 0}
  .tiles{grid-template-columns:1fr 1fr}
  .incl{grid-template-columns:1fr}
  .foot .top{gap:44px}
  .hero .wrap{padding-bottom:110px}
}
@media (max-width:560px){
  .wrap{width:calc(100% - 40px)}
  .brand{font-size:18px;letter-spacing:.34em}.brand small{display:none}
  .fields{grid-template-columns:1fr}
  .hero p{font-size:16px}
  .stickbar .l{display:none}.stickbar .wrap{justify-content:flex-end}
  .cmeta{flex-direction:column;gap:12px}.cprice{text-align:start}
  .ctitle{flex-direction:column;align-items:flex-start}
  .panel,.quote{padding:26px 22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important;animation-delay:0s!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}

/* ---- макет: поиск по датам, серый каркас, плавающая кнопка ---- */
.sband{background:var(--bg2);border-block:1px solid var(--line)}
.sband .wrap{display:grid;grid-template-columns:1fr 1fr auto;gap:28px;align-items:end;padding:28px 0;position:relative}
.sband label span{font-size:12px;color:var(--muted);letter-spacing:.1em}
.sband .btn{align-self:end}
.serr{position:absolute;inset-inline:0;bottom:4px;font-size:12px;color:#e59a8f;margin:0;min-height:1em}
.period{margin:-8px 0 28px;font-size:14px;color:var(--accent)}
.card .ptotal{display:block;margin-top:6px;font-size:13px;color:var(--accent)}
.wfs{border-top:1px solid var(--line)}
.wfs.alt{background:var(--bg2)}
.wf-bar{display:block;height:10px;background:#2b2b2f;border-radius:2px;margin:12px 0 0}
.wf-sq{display:block;width:48px;height:48px;background:#2b2b2f;margin-bottom:22px}
.wf-circle{display:block;width:56px;height:56px;border-radius:50%;background:#2b2b2f;margin-bottom:22px;flex:none}
.wfs h2{margin-bottom:48px}
